# 로컬: docker compose up -d                 (postgres, redis, minio)
# 서버: docker compose --profile prod up -d  (+ caddy, api-1, api-2, ai)

services:
  postgres:
    image: pgvector/pgvector:pg16   # postgres 16 + vector 확장. 확장 켜기 전엔 일반 postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"       # 로컬 개발용. 서버에서는 제거 (DB 외부 노출 금지)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "minio", "ready", "--cluster"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  caddy:
    profiles: ["prod"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # 인증서 저장. 없으면 재시작마다 재발급 → Let's Encrypt 주간 한도
      - caddy_config:/config
    environment:
      DOMAIN_ROOT: ${DOMAIN_ROOT}
    depends_on: [api-1, api-2]
    restart: always

  api-1: &api                       # 2개 띄워 순차 교체(무중단). caddy가 헬스체크로 분배
    profiles: ["prod"]
    build: ./backend
    env_file: .env
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs   # 운영 로그는 JSON(ECS). 로컬 bootRun 은 application.yml 의 텍스트 패턴
    expose: ["8080"]                # ports 아님. 내부 네트워크만
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    stop_grace_period: 35s          # spring graceful shutdown 30s + 여유
    restart: always

  api-2:
    <<: *api

  ai:
    profiles: ["prod"]
    build: ./ai
    env_file: .env
    expose: ["8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
