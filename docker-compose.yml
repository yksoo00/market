# 로컬: docker compose up -d                 (postgres, redis)
# 앱 컨테이너: docker compose --profile prod up -d  (+ api-1, api-2)

services:
  postgres:
    image: pgvector/pgvector:pg16 # postgres 16 + vector 확장. 확장 켜기 전엔 일반 postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # 로컬 개발용. 서버에서는 제거 (DB 외부 노출 금지)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  api-1: &api # 앱 복제본. 역방향 프록시는 현재 구성에서 실행하지 않음
    profiles: ["prod"]
    build: ./backend
    env_file: .env
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs # 운영 로그는 JSON(ECS). 로컬 bootRun 은 application.yml 의 텍스트 패턴
      STORAGE_ROOT: /data/uploads
    volumes:
      - uploads_data:/data/uploads # 업로드 파일. api-1·api-2 가 같은 volume 을 본다. DB 와 함께 백업 대상
    expose: ["8080"] # ports 아님. 내부 네트워크만
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8080/actuator/health | grep -q ''"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    stop_grace_period: 35s # spring graceful shutdown 30s + 여유
    restart: always

  api-2:
    <<: *api

volumes:
  pg_data:
  redis_data:
  uploads_data:
