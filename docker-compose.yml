# 로컬: docker compose up -d                 (postgres, redis)
# 앱 컨테이너: docker compose --profile prod up -d  (+ api-1, api-2)
# 백엔드 개발: docker compose up --watch api-dev     (+ postgres, redis. 소스 저장 시 자동 재시작)

services:
  postgres:
    image: pgvector/pgvector:pg16 # postgres 16 + vector 확장. 확장 켜기 전엔 일반 postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # 로컬 개발용. 서버에서는 제거 (DB 외부 노출 금지)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  api-1: &api # 앱 복제본. 역방향 프록시는 현재 구성에서 실행하지 않음
    profiles: ["prod"]
    build: ./backend
    env_file: .env
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs # 운영 로그는 JSON(ECS). 로컬 bootRun 은 application.yml 의 텍스트 패턴
      STORAGE_ROOT: /data/uploads
    volumes:
      - uploads_data:/data/uploads # 업로드 파일. api-1·api-2 가 같은 volume 을 본다. DB 와 함께 백업 대상
    expose: ["8080"] # ports 아님. 내부 네트워크만
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8080/actuator/health | grep -q ''"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    stop_grace_period: 35s # spring graceful shutdown 30s + 여유
    restart: always

  api-2:
    <<: *api

  api-dev: # 로컬 개발용 백엔드. 호스트 bootRun 과 8080 을 같이 쓰므로 둘 중 하나만
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    init: true # sh 가 PID 1 이면 종료 신호가 gradle 까지 안 감
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /data/uploads
    volumes:
      - gradle_cache:/root/.gradle # 의존성·데몬 캐시. 컨테이너를 다시 만들어도 재다운로드 안 함
      - ./backend/data/uploads:/data/uploads # 호스트 bootRun 과 같은 업로드 폴더 (gitignore)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    develop:
      watch:
        - action: sync # 복사만. 컴파일·재시작은 컨테이너 안 gradle --continuous + devtools
          path: ./backend/src
          target: /workspace/src
        - action: rebuild # 빌드 설정·wrapper·이미지 정의가 바뀌면 이미지부터 다시
          path: ./backend/build.gradle
        - action: rebuild
          path: ./backend/settings.gradle
        - action: rebuild
          path: ./backend/gradle
        - action: rebuild
          path: ./backend/Dockerfile.dev

volumes:
  pg_data:
  redis_data:
  uploads_data:
  gradle_cache:
