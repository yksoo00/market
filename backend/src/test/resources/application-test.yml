spring:
  security:
    oauth2:
      client:
        registration:
          kakao: { client-id: test-kakao-id }
          naver: { client-id: test-naver-id, client-secret: test-naver-secret }
          google: { client-id: test-google-id, client-secret: test-google-secret }

app:
  env: local
  jwt:
    secret: test-secret-test-secret-test-secret-32bytes
  internal-token: test-token
  identity-verification:
    provider: stub
  admin:
    login-id: admin
    password: admin-test-password!1
  pii-key: dGVzdC1waWkta2V5LXRlc3QtcGlpLWtleS0zMmJ5dGU=   # 테스트 전용. 'test-pii-key-test-pii-key-32byte' 의 base64
