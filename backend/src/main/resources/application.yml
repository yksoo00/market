spring:
  application:
    name: market

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate            # 스키마는 flyway만. update/create 금지
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  security:
    oauth2:
      client:
        # 콜백은 백엔드가 받는다. redirect-uri 는 각 콘솔에 등록한 값과 정확히 같아야 함 (docs/setup.md "소셜 로그인 콘솔 설정")
        registration:
          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID:unset}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}            # 카카오는 secret 이 선택. 콘솔에서 켜지 않았으면 비움
            client-authentication-method: client_secret_post     # 카카오·네이버는 basic 인증을 안 받음
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/oauth/{registrationId}/callback"
            scope: account_email, profile_nickname
          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:unset}                # 키가 없어도 앱은 뜬다(빈 값이면 기동 실패). 그 제공자 버튼만 실패
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:unset}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/oauth/{registrationId}/callback"
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:unset}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:unset}
            redirect-uri: "{baseUrl}/api/v1/auth/oauth/{registrationId}/callback"
            scope: openid, email, profile
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response                          # 네이버는 프로필이 response 객체 안에 있음

  jackson:
    time-zone: UTC

  lifecycle:
    timeout-per-shutdown-phase: 30s  # 무중단 배포: 교체 시 진행 중 요청 마무리 시간

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native  # caddy 뒤. 클라이언트 IP·https 판단용

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  env: ${APP_ENV:prod}                        # local 에서만 개발용 우회(stub 본인인증 등)가 켜진다. 기본값은 운영
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  internal-token: ${INTERNAL_TOKEN}
  app-url: ${APP_URL:http://localhost:3000}   # CORS·Origin 검사에 허용하는 유일한 프론트 출처
  identity-verification:
    provider: ${IDENTITY_VERIFICATION_PROVIDER:pass}   # 기본값은 안전한 쪽(stub 거부). 로컬 .env 에서만 stub
  terms:
    version: ${TERMS_VERSION:2026-09-22-draft}          # 약관 시행일. 법무 검토 후 확정값으로
  admin:
    login-id: ${ADMIN_LOGIN_ID:}               # 둘 다 있고 admin 이 없을 때만 앱 시작 시 1명 생성
    password: ${ADMIN_PASSWORD:}
  pii-key: ${PII_ENCRYPTION_KEY}    # 이름·휴대폰·CI 컬럼 암호화 키. 32바이트 base64. 바꾸면 전체 재암호화 필요
  ai-url: ${AI_URL:http://localhost:8000}
  domain-root: ${DOMAIN_ROOT:localhost}

logging:
  level:
    root: info
  # 로컬(사람이 읽음): 한 줄 텍스트 + requestId·userId. 운영은 docker-compose 가
  # LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs 로 JSON 으로 바꾼다 (MDC 는 자동 포함). 라이브러리 없이 Boot 내장 기능
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-},%X{userId:-}] %-40.40logger{39} : %m%n"
