spring:
  application:
    name: market

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate            # 스키마는 flyway만. update/create 금지
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  # 소셜 로그인은 단일 users 테이블 전환을 마칠 때까지 비활성화한다.
  # security:
  #   oauth2:
  #     client:
  #       registration: ...
  #       provider: ...

  jackson:
    time-zone: UTC

  lifecycle:
    timeout-per-shutdown-phase: 30s  # 무중단 배포: 교체 시 진행 중 요청 마무리 시간

  # 업로드 바깥 상한(가장 큰 용도 10MB 기준). 용도별 상한(사진 5MB 등)은 UploadKind 가 검사
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native  # caddy 뒤. 클라이언트 IP·https 판단용
  tomcat:
    # 상한 초과 업로드의 나머지 본문을 이만큼은 읽고 버린 뒤 413 JSON 을 보낸다. 기본 2MB 면 그보다 큰 초과분은
    # 연결이 끊겨 브라우저가 413 대신 네트워크 오류를 본다. 이보다 더 크면 끊김 (무한으로 두면 대역폭 낭비)
    max-swallow-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  env: ${APP_ENV:prod}                        # local 에서만 개발용 우회(stub 본인인증 등)가 켜진다. 기본값은 운영
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  app-url: ${APP_URL:http://localhost:3000}   # CORS·Origin 검사에 허용하는 유일한 프론트 출처
  identity-verification:
    provider: ${IDENTITY_VERIFICATION_PROVIDER:pass}   # 기본값은 안전한 쪽(stub 거부). 로컬 .env 에서만 stub
  terms:
    version: ${TERMS_VERSION:2026-09-22-draft}          # 약관 시행일. 법무 검토 후 확정값으로
  admin:
    login-id: ${ADMIN_LOGIN_ID:}               # 둘 다 있고 admin 이 없을 때만 앱 시작 시 1명 생성
    password: ${ADMIN_PASSWORD:}
  pii-key: ${PII_ENCRYPTION_KEY}    # 이름·휴대폰·CI 컬럼 암호화 키. 32바이트 base64. 바꾸면 전체 재암호화 필요
  domain-root: ${DOMAIN_ROOT:localhost}
  storage:
    root: ${STORAGE_ROOT:./data/uploads}   # 업로드 파일 루트. Compose 는 volume 경로, 로컬 bootRun 은 backend/data/uploads (decisions.md 2026-10-02)
    min-free: 10GB                          # 디스크 여유 공간이 이보다 적으면 업로드 거부(503). 같은 디스크의 Postgres 보호 (security.md "파일 업로드")

logging:
  level:
    root: info
  # 로컬(사람이 읽음): 한 줄 텍스트 + requestId·userId. 운영은 docker-compose 가
  # LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs 로 JSON 으로 바꾼다 (MDC 는 자동 포함). 라이브러리 없이 Boot 내장 기능
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-},%X{userId:-}] %-40.40logger{39} : %m%n"
  charset:
    console: UTF-8    # Windows 콘솔 기본 codepage(CP949)로 한글 로그 깨짐 방지
